name: 建置匯率抓取容器並更新 Container Apps Job

on:
  push:
    branches: [master]
    paths:
      - 'BotRateJob/**'
      - '.github/workflows/BotRateJob.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: botratejob
  JOB_NAME: botrate-job
  RESOURCE_GROUP: Yanyue

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 建置並推送映像
        uses: docker/build-push-action@v6
        with:
          context: BotRateJob
          file: BotRateJob/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure 登入
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 映像是公開的，Container Apps 匿名拉取即可，不需要註冊表憑證
      - name: 更新 Container Apps Job 映像
        run: |
          az containerapp job update \
            --name ${{ env.JOB_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
